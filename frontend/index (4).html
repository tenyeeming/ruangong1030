<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>🏚️ 廢墟活動平台 - 查看報名清單</title>
    <style>
        body { background-color: #1a1a1a; color: #d4d4d4; font-family: sans-serif; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; border: 2px dashed #555; padding: 20px; background-color: #111; }
        h1 { color: #8b0000; border-bottom: 1px solid #444; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #444; padding: 10px; text-align: left; }
        th { background-color: #222; color: #8b0000; }
        .back-link { color: #888; text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>📊 後台：查看活動報名清單</h1>
    <h3 style="color: #888;">活動：<span id="event-name" style="color:#fff;">-</span></h3>
    
    <table id="reg-table" style="display: none;">
        <thead>
            <tr>
                <th>報名者姓名</th>
                <th>聯絡電話</th>
                <th>報名時間</th>
            </tr>
        </thead>
        <tbody id="reg-list"></tbody>
    </table>
    
    <div id="no-data" style="margin: 20px 0; color: #666; display: none;">目前尚無報名。</div>

    <hr style="border-color: #333; margin-top: 30px;">
    <a href="index.html" class="back-link">⬅️ 返回活動清單</a>
</div>

<script src="js/api.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const eventId = urlParams.get('id');

    async function loadRegistrations() {
        try {
            const data = await getRegistrations(eventId);
            document.getElementById('event-name').innerText = data.event.title;
            
            const tbody = document.getElementById('reg-list');
            if (!data.registrations || data.registrations.length === 0) {
                document.getElementById('no-data').style.display = 'block';
                return;
            }
            
            document.getElementById('reg-table').style.display = 'table';
            tbody.innerHTML = data.registrations.map(r => `
                <tr>
                    <td>${r.name}</td>
                    <td>${r.phone}</td>
                    <td>${r.created_at}</td>
                </tr>
            `).join('');
        } catch (err) {
            alert('載入名單失敗');
        }
    }
    loadRegistrations();
</script>
</body>
</html>
