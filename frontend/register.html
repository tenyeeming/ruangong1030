<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>填寫報名表｜活動報名平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container narrow">
    <a href="index.html" class="back-link">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        返回活動清單
    </a>

    <header class="page-head">
        <h1>填寫報名表</h1>
    </header>

    <section class="panel" aria-labelledby="act-title">
        <p class="eyebrow">您正在報名</p>
        <h2 id="act-title" class="summary-title">載入中...</h2>
        <p id="act-info" class="muted"></p>
    </section>

    <form id="register-form" style="display: none;">
      <div class="panel form-panel">
        <div class="field">
            <label for="user-name">姓名<span class="field-tag required">必填</span></label>
            <input type="text" id="user-name" required maxlength="50" autocomplete="name" placeholder="請輸入您的真實姓名">
        </div>

        <div class="field">
            <label for="user-phone">聯絡電話<span class="field-tag required">必填</span></label>
            <input type="tel" id="user-phone" required maxlength="10" inputmode="numeric" autocomplete="tel" placeholder="例如：0912345678" aria-describedby="phone-hint">
            <p id="phone-hint" class="hint">09 開頭，共 10 位數字。</p>
        </div>

        <div class="form-actions">
            <button type="submit" id="submit-btn" class="btn btn-primary">送出報名</button>
        </div>
      </div>
    </form>
</main>

<script src="js/api.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const eventId = urlParams.get('id');

    // 找不到活動就不顯示報名表
    async function loadActivityName() {
        const titleSpan = document.getElementById('act-title');
        const events = await getEvents();
        if (!Array.isArray(events)) {
            titleSpan.textContent = '載入失敗：' + events.error;
            return;
        }
        const currentEvent = events.find(e => String(e.id) === eventId);
        if (!currentEvent) {
            titleSpan.textContent = '找不到此活動';
            return;
        }
        titleSpan.textContent = currentEvent.title;
        const info = document.getElementById('act-info');
        info.textContent = `報名截止：${currentEvent.deadline || '不限'} | 目前報名人數：${Number(currentEvent.count) || 0} 人`;
        if (currentEvent.is_closed) {
            info.textContent += '（此活動已截止報名）';
            info.className = 'error';
            return;
        }
        document.getElementById('register-form').style.display = 'block';
    }
    loadActivityName();

    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('user-name').value.trim();
        const phone = document.getElementById('user-phone').value.trim();

        if (!name) {
            alert('姓名不可只有空白！');
            return;
        }
        if (!/^09\d{8}$/.test(phone)) {
            alert('手機號碼格式不正確，請輸入09開頭的10位數字！');
            return;
        }

        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        const res = await register(eventId, { name, phone });
        btn.disabled = false;

        if (res.ok) {
            alert('報名成功！');
            window.location.href = 'index.html';
        } else {
            alert('報名失敗：' + res.error);
        }
    });
</script>
</body>
</html>
