<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>🏚️ 廢墟活動平台 - 活動清單</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <h1>🏚️ 廢墟版活動報名平台 (基本款)</h1>
    <div style="margin-bottom: 20px;">
        <a href="create.html" class="btn">➕ 新增活動</a>
    </div>

    <h2>📅 可報名活動清單</h2>
    <div id="events-list"><p class="muted">載入中...</p></div>
</div>

<script src="js/api.js"></script>
<script>
    async function renderEvents() {
        const listDiv = document.getElementById('events-list');
        const events = await getEvents();

        if (!Array.isArray(events)) {
            listDiv.innerHTML = `<p class="error">載入失敗：${escapeHtml(events.error)}</p>`;
            return;
        }
        if (events.length === 0) {
            listDiv.innerHTML = '<p class="muted">目前尚無任何活動。</p>';
            return;
        }

        listDiv.innerHTML = events.map(evt => `
            <div class="activity-card">
                <div>
                    <strong>【${escapeHtml(evt.title)}】</strong>
                    <p>時間：${escapeHtml(evt.event_date || '未定')} | 說明：${escapeHtml(evt.description || '無')}</p>
                </div>
                <div class="btn-group">
                    <a href="register.html?id=${encodeURIComponent(evt.id)}" class="btn">📝 報名</a>
                    <a href="registrations.html?id=${encodeURIComponent(evt.id)}" class="btn btn-secondary">📊 名單</a>
                </div>
            </div>
        `).join('');
    }
    renderEvents();
</script>
</body>
</html>
