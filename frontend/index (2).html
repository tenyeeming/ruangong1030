<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>🏚️ 廢墟活動平台 - 新增活動</title>
    <style>
        body { background-color: #1a1a1a; color: #d4d4d4; font-family: sans-serif; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; border: 2px dashed #555; padding: 20px; background-color: #111; }
        h1 { color: #8b0000; border-bottom: 1px solid #444; padding-bottom: 10px; }
        input, textarea, button { background-color: #2a2a2a; border: 1px solid #555; color: #fff; padding: 8px; width: 95%; margin-bottom: 15px; }
        button { background-color: #8b0000; font-weight: bold; cursor: pointer; width: 100%; }
        button:hover { background-color: #ff0000; }
        .back-link { color: #888; text-decoration: none; }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>
<div class="container">
    <h1>🛠️ 後台：新增新的活動</h1>
    <form id="create-form">
        <label>活動名稱（必填）：</label>
        <input type="text" id="title" required placeholder="例如：失落古宅探索">
        
        <label>活動說明：</label>
        <textarea id="description" rows="4" placeholder="請輸入活動詳細說明"></textarea>
        
        <label>活動時間：</label>
        <input type="datetime-local" id="event_date" required>
        
        <button type="submit">➕ 建立新活動</button>
    </form>
    <hr style="border-color: #333;">
    <a href="index.html" class="back-link">⬅️ 返回活動清單</a>
</div>

<script src="js/api.js"></script>
<script>
    document.getElementById('create-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            title: document.getElementById('title').value.trim(),
            description: document.getElementById('description').value.trim(),
            event_date: document.getElementById('event_date').value.replace('T', ' ')
        };
        
        const res = await createEvent(data);
        if (res.ok) {
            alert('活動建立成功！');
            window.location.href = 'index.html';
        } else {
            alert('建立失敗：' + res.error);
        }
    });
</script>
</body>
</html>
