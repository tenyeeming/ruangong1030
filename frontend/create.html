<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>🏚️ 廢墟活動平台 - 新增活動</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container narrow">
    <h1>🛠️ 後台：新增新的活動</h1>
    <form id="create-form">
        <label for="title">活動名稱（必填）：</label>
        <input type="text" id="title" required maxlength="100" placeholder="例如：失落古宅探索">

        <label for="description">活動說明：</label>
        <textarea id="description" rows="4" placeholder="請輸入活動詳細說明"></textarea>

        <label for="event_date">活動時間：</label>
        <input type="datetime-local" id="event_date" required>

        <button type="submit" id="submit-btn">➕ 建立新活動</button>
    </form>
    <hr>
    <a href="index.html" class="back-link">⬅️ 返回活動清單</a>
</div>

<script src="js/api.js"></script>
<script>
    document.getElementById('create-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            title: document.getElementById('title').value.trim(),
            description: document.getElementById('description').value.trim(),
            event_date: document.getElementById('event_date').value.replace('T', ' ')
        };

        if (!data.title) {
            alert('活動名稱不可只有空白！');
            return;
        }

        // 送出期間停用按鈕，避免連點重複建立
        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        const res = await createEvent(data);
        btn.disabled = false;

        if (res.ok) {
            alert('活動建立成功！');
            window.location.href = 'index.html';
        } else {
            alert('建立失敗：' + res.error);
        }
    });
</script>
</body>
</html>
