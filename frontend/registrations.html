<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>報名名單｜活動報名平台</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="container">
    <a href="index.html" class="back-link">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        返回活動清單
    </a>

    <header class="page-head">
        <h1>報名名單</h1>
    </header>

    <section class="panel summary-row" aria-labelledby="event-name">
        <div>
            <p class="eyebrow">活動</p>
            <h2 id="event-name" class="summary-title">-</h2>
        </div>
        <p class="reg-count-line">目前報名人數：<span id="reg-count">-</span> 人</p>
    </section>

    <div class="table-wrap">
        <table id="reg-table" style="display: none;">
            <thead>
                <tr>
                    <th scope="col">報名者姓名</th>
                    <th scope="col">聯絡電話</th>
                    <th scope="col">報名時間</th>
                </tr>
            </thead>
            <tbody id="reg-list"></tbody>
        </table>
    </div>

    <div id="message" class="muted">載入中...</div>
</main>

<script src="js/api.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const eventId = urlParams.get('id');

    async function loadRegistrations() {
        const message = document.getElementById('message');
        const data = await getRegistrations(eventId);

        if (data.ok === false || !data.event) {
            message.className = 'error';
            message.textContent = '載入名單失敗：' + (data.error || '資料格式錯誤');
            return;
        }

        document.getElementById('event-name').textContent = data.event.title;
        document.getElementById('reg-count').textContent = data.count ?? (data.registrations || []).length;

        if (!data.registrations || data.registrations.length === 0) {
            message.textContent = '目前尚無報名。';
            return;
        }

        message.style.display = 'none';
        document.getElementById('reg-table').style.display = 'table';
        document.getElementById('reg-list').innerHTML = data.registrations.map(r => `
            <tr>
                <td>${escapeHtml(r.name)}</td>
                <td>${escapeHtml(r.phone)}</td>
                <td>${escapeHtml(r.created_at)}</td>
            </tr>
        `).join('');
    }
    loadRegistrations();
</script>
</body>
</html>
